<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark App Tile Gradient -->
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080C11"/>
      <stop offset="50%" stop-color="#0D0808"/>
      <stop offset="78%" stop-color="#220C04"/>
      <stop offset="100%" stop-color="#361405"/>
    </linearGradient>

    <!-- Warm Horizon Sun Glow rising from bottom -->
    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="62%">
      <stop offset="0%" stop-color="#FF8226" stop-opacity="1"/>
      <stop offset="20%" stop-color="#F47B20" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#B8480E" stop-opacity="0.55"/>
      <stop offset="72%" stop-color="#4E1B06" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070B0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Border Stroke -->
    <linearGradient id="tileStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f47b20" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Main Diagonal Ribbon Gradient -->
    <linearGradient id="mainRibbonGrad" x1="0.15" y1="0.15" x2="0.85" y2="0.85">
      <stop offset="0%" stop-color="#F67721"/>
      <stop offset="30%" stop-color="#F47B20"/>
      <stop offset="58%" stop-color="#EBA56C"/>
      <stop offset="85%" stop-color="#F6D6AE"/>
      <stop offset="100%" stop-color="#F8DFC0"/>
    </linearGradient>

    <!-- Top-Right Wing (Warm Cream) -->
    <linearGradient id="creamWingGrad" x1="0.5" y1="0" x2="0.85" y2="0.5">
      <stop offset="0%" stop-color="#FEF8F0"/>
      <stop offset="40%" stop-color="#F8DFC0"/>
      <stop offset="100%" stop-color="#F3CE9E"/>
    </linearGradient>

    <!-- Bottom-Left Wing (Vivid Orange) -->
    <linearGradient id="orangeWingGrad" x1="0.15" y1="0.85" x2="0.5" y2="0.5">
      <stop offset="0%" stop-color="#F98C33"/>
      <stop offset="55%" stop-color="#F47B20"/>
      <stop offset="100%" stop-color="#E6660D"/>
    </linearGradient>

    <!-- Continuous Apple Squircle Path -->
    <clipPath id="tileClip">
      <path d="M 125 4 C 45 4, 4 45, 4 125 L 4 387 C 4 467, 45 508, 125 508 L 387 508 C 467 508, 508 467, 508 387 L 508 125 C 508 45, 467 4, 387 4 Z"/>
    </clipPath>
  </defs>

  <!-- App Icon Base Squircle -->
  <path d="M 125 4 C 45 4, 4 45, 4 125 L 4 387 C 4 467, 45 508, 125 508 L 387 508 C 467 508, 508 467, 508 387 L 508 125 C 508 45, 467 4, 387 4 Z" fill="url(#tileBg)" stroke="url(#tileStroke)" stroke-width="2"/>

  <!-- Horizon Glow rising from bottom edge (Clipped inside tile) -->
  <g clip-path="url(#tileClip)">
    <ellipse cx="256" cy="520" rx="250" ry="160" fill="url(#bottomGlow)"/>
    
    <!-- Wing 2: Top-Right Cream Wing -->
    <path d="M 356.79 132.68 C 361.46 132.53, 375.20 131.40, 382.65 132.33 C 390.11 133.27, 395.34 134.75, 401.52 138.29 C 407.70 141.84, 414.93 147.77, 419.74 153.61 C 424.54 159.44, 437.41 166.67, 430.34 173.32 C 423.26 179.98, 395.49 183.00, 377.26 193.56 C 359.03 204.12, 336.12 235.26, 320.96 236.68 C 305.79 238.11, 293.42 210.52, 286.26 202.11 C 279.10 193.70, 273.15 194.44, 277.99 186.22 C 282.82 178.00, 302.51 161.61, 315.28 152.78 C 328.06 143.95, 347.71 136.58, 354.62 133.23 C 361.54 129.89, 352.12 132.83, 356.79 132.68 Z" fill="url(#creamWingGrad)"/>

    <!-- Wing 3: Bottom-Left Orange Wing -->
    <path d="M 197.52 264.54 C 203.62 270.75, 225.82 293.35, 232.19 301.81 C 238.55 310.27, 243.42 305.32, 235.71 315.28 C 228.00 325.24, 198.27 351.70, 185.94 361.56 C 173.60 371.43, 170.22 371.41, 161.68 374.46 C 153.15 377.52, 142.37 379.62, 134.74 379.90 C 127.10 380.18, 122.14 378.58, 115.87 376.15 C 109.60 373.71, 102.98 371.51, 97.11 365.29 C 91.25 359.08, 74.39 347.20, 80.66 338.86 C 86.93 330.51, 115.59 327.59, 134.74 315.21 C 153.88 302.82, 185.07 272.98, 195.53 264.54 C 205.99 256.10, 191.41 258.33, 197.52 264.54 Z" fill="url(#orangeWingGrad)"/>

    <!-- Wing 1: Main Diagonal Ribbon (Passes in front) -->
    <path d="M 130.43 132.68 C 137.35 132.99, 156.48 131.54, 169.77 135.10 C 183.06 138.65, 197.18 145.56, 210.19 154.04 C 223.20 162.51, 224.46 161.41, 247.81 185.94 C 271.17 210.46, 328.29 278.63, 350.32 301.19 C 372.34 323.76, 368.06 315.26, 379.96 321.32 C 391.86 327.39, 414.76 333.64, 421.72 337.59 C 428.68 341.55, 424.19 340.75, 421.71 345.06 C 419.24 349.38, 414.29 357.88, 406.88 363.50 C 399.47 369.12, 388.04 376.94, 377.26 378.77 C 366.49 380.60, 354.36 378.94, 342.23 374.46 C 330.11 369.99, 328.31 374.79, 304.51 351.90 C 280.70 329.01, 223.19 261.45, 199.38 237.14 C 175.58 212.84, 175.15 214.87, 161.68 206.07 C 148.22 197.27, 131.80 189.39, 118.57 184.33 C 105.33 179.28, 88.21 178.62, 82.27 175.74 C 76.33 172.85, 80.85 171.07, 82.91 167.04 C 84.97 163.00, 87.05 157.16, 94.60 151.52 C 102.16 145.89, 122.29 136.37, 128.26 133.23 C 134.24 130.09, 123.51 132.37, 130.43 132.68 Z" fill="url(#mainRibbonGrad)"/>
  </g>
</svg>